<section class="section section--band" id="products" aria-labelledby="products-title">
  <div class="wrap">
    <div class="section__head">
      {% include tag.html n="02" label="AI products" %}
      <h2 class="h2 rv-mask" id="products-title"><span>Products I <em class="serif">shipped.</em></span></h2>
      <p class="section__lede rv">AI products I took from research to launch at RSP Architects, and MeetFlow AI, my own.</p>
    </div>
    <ul class="products">
      {% for pr in site.data.products %}
      {% include product-card.html product=pr i=forloop.index features="no" %}
      {% endfor %}
    </ul>
  </div>
</section>
