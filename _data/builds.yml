# Things I have built at Berkeley (coursework and ventures in progress).
- title: Mind the Gap
  kicker: Metro trivia web app · Replit
  description: >-
    A ten-station trivia quiz about the world's metro systems, built with plain
    HTML, CSS and JavaScript. Question, TrueFalseQuestion and Quiz classes,
    instant answer feedback with a route-map progress bar, a live code-concepts
    inspector, and a rush-hour timer mode.
  status: Live
  link: https://mind-the-gap-quiz.replit.app
  link_label: Play it
- title: Birthday Countdown
  kicker: First web app · Replit
