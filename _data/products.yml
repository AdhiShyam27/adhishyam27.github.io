- id: ai-task-force
  index: "04"
  title: AI Task Force
  kicker: Internal program · RSP
  description: Founded and mentored 15+ cross-functional staff; built an internal AI rendering tool with Hugging Face ControlNet and Stable Diffusion and scaled it to RSP studios from the Middle East to Southeast Asia; scoped and prioritized features that boosted revenue 20% in Q1.
  stat: "15+"
  stat_label: staff mentored
  where: RSP studios, from the Middle East to Southeast Asia
  story:
    - I founded RSP's AI Task Force and mentored 15+ cross-functional staff. We scoped and prioritized features that boosted revenue 20% in Q1.
    - One of the things I built with the task force is RSP's own internal AI rendering tool, developed with Hugging Face ControlNet and Stable Diffusion. ControlNet follows the lines of a designer's sketch, and Stable Diffusion renders it as an image. We scaled the tool to all RSP studios, from the Middle East to Southeast Asia.
    - "The images on this page are demos I made to show the method: two of my own hand sketches for Hangzhou Expo Town, run through ControlNet (scribble) and Stable Diffusion 1.5 on Hugging Face. They are not output from RSP's internal tool."
  my_role: Founded and mentored 15+ cross-functional staff; scoped and prioritized features that boosted revenue 20% in Q1.
  photos:
    - "Demo: AI render from my Hangzhou Expo Town hand sketch, ControlNet (scribble) and Stable Diffusion 1.5"
    - "The input: my hand sketch for Hangzhou Expo Town, China"
    - "Demo: AI render from my Hangzhou Expo Town massing sketch, same method"
    - "The input: my massing sketch for Hangzhou Expo Town, China"
  features:
    - Founded the task force
    - Internal AI rendering tool with ControlNet and Stable Diffusion
    - Scaled to RSP studios from the Middle East to Southeast Asia
    - Revenue up 20% in Q1
  ui: board

- id: meetflow-ai
  index: "05"
  title: MeetFlow AI
  kicker: AI meeting assistant · Chrome extension
  description: >-
    Captures live transcripts in Chrome and turns saved meetings into summaries,
    action items and follow-up workflows, without sending a bot into the call.
  stat: "33+"
  stat_label: languages supported
  firm: MeetFlow AI (my product)
  where: Chrome, for Google Meet, Zoom and MS Teams
  date_label: Private beta, rolling out to a first group of 50 users
  story:
    - >-
      MeetFlow AI's promise is "Your meetings, distilled into action." It captures
      live transcripts in Chrome, then turns saved meetings into summaries, action
      items and follow-up workflows, without sending a bot into the call. It works
      with Google Meet, Zoom and MS Teams.
    - >-
      Live transcription runs in the browser or from recordings, with speaker
      labels and 33+ languages with auto-detection. AI summaries pull out action
      items and decisions and draft follow-ups, and AI Workflows send the results
      to Slack, Gmail, Notion, Linear or a custom webhook in one click.
    - >-
      Data is encrypted at rest, capture is bot-free, and third-party workflows are
      opt-in. MeetFlow is rolling out to a first group of 50 users for weekly
      product feedback and fast iteration, with Free, Pro, Team and Enterprise plans.
  my_role: >-
    My own product, shipped as a Chrome extension.
  press: https://meetflow-ai.vercel.app/
  press_label: Visit MeetFlow AI
  photos:
    - The MeetFlow AI home page
  features:
    - Live transcription, no bot in the call
    - AI summaries, action items and decisions
    - Workflows to Slack, Gmail, Notion and Linear
  ui: chat

