  description: Scoped, launched, and iterated with engineers and designers for SingPost.
  stat: "70%+"
  stat_label: adoption in 3 months
  where: POPStop, Tampines MRT, Singapore
  partners: SingPost (Singapore Post)
  story:
    - >-
      Singapore's first AI concierge, launched by RSP with SingPost, Singapore's
      largest postal service provider. Located at the POPStop at Tampines MRT, the
      first POPStop e-commerce pick-up and drop-off point for SingPost.
    - >-
      Customers are greeted by a generative AI service assistant named Peggie on a
      large vertical screen. Peggie answers FAQs and general questions and helps
      customers buy and print labels for their parcels.
    - >-
      The collaboration set out to build an AI solution that helps consumer-facing
      businesses like SingPost with manpower constraints and high volumes of
      customer queries.
