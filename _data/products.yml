- id: aiva
  index: "02"
  title: AIVA
  kicker: Transport concierge · SBS Transit
  description: Led commuter research (200+ interviews) to define requirements; piloted with SBS Transit, earning 80%+ satisfaction and citywide deployment interest.
  stat: "80%+"
  stat_label: pilot satisfaction
  date_label: Announced 31 May 2024
  where: SBS Transit bus interchanges and MRT stations, Singapore
  partners: SBS Transit, Samadhi Ventures, Pantheon Lab
  story:
    - >-
      AIVA (Artificial Intelligence Virtual Assistant) is an AI digital human
      concierge designed to improve the customer experience at SBS Transit's bus
      interchanges and MRT stations, built by RSP with SBS Transit, Samadhi
      Ventures and Pantheon Lab.
    - >-
      It was announced on 31 May 2024 at the launch of SBS Transit's Mobility
      Innovation Centre (MINNOVA), where RSP signed a Memorandum of Understanding
      with SBS Transit to develop an intelligent avatar for better customer
      experience at transport nodes.
    - >-
      AIVA's speech is powered by generative AI. It talks with passengers at
      digital kiosks and gives travel information such as travel card help,
      wayfinding maps and bus arrival times. It was trialled at Ang Mo Kio Bus
      Interchange from June 2024, with a second kiosk planned for Bayfront Station
      on the Downtown Line.
  my_role: >-
    Led commuter research (200+ interviews) to define requirements; piloted with
    SBS Transit, earning 80%+ satisfaction and citywide deployment interest.
  press: https://rsp.design/rsp-signs-mou-with-sbs-transit-and-launch-ai-concierge-aiva/
  photos:
    - With the AIVA kiosk, January 2025
    - Talking to AIVA at an SBS Transit kiosk
    - "With Mark Ong, Vice President, Strategic Development, and Beh Swee Chiew, CEO, RSP, beside AIVA"
    - AIVA at the launch of SBS Transit's Mobility Innovation Centre (MINNOVA), 31 May 2024
    - "Jeffrey Sim, SBS Transit, and Beh Swee Chiew, RSP, sign the MOU, 31 May 2024"
  features:
    - 200+ commuter interviews
    - Travel card help, wayfinding and bus arrival times
    - Trialled at Ang Mo Kio Bus Interchange
  ui: transit

