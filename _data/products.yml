  where: Decentraland, Virtual Reality Shopping (VRS) district
  partners: Octava and ARC; builder partner of The Sandbox
  story:
    - >-
      RSP META (Space+) is RSP's first metaverse venture, created to push the
      architectural practice beyond the bounds of the physical world. It brings
      together a multi-disciplinary team of game developers, master planners,
      experience designers and architects.
    - >-
      RSP deployed a virtual office in Decentraland's Virtual Reality Shopping (VRS)
      district to meet and greet clients interested in developing virtual plots and
      metaverse architecture. The Decentraland gallery features a floating NFT art
