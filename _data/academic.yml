# Academic studio projects (from my NUS and SPA portfolio).
- title: The NEXUS
  kicker: Master plan & urban design · NUS
  description: >-
    Integrating people and place at the crossroads of nature, home and economy
    of the future: a master plan for Singapore's Greater Southern Waterfront,
    a 410-hectare site freed up by the relocation of the City Terminal and
    Pasir Panjang ports.
  image: /assets/img/academic/01
  alt: Illustrative master plan of the NEXUS proposal for Singapore's Greater Southern Waterfront and Brani Island
- title: Interaction with Nature
  kicker: Urban design studio · NUS
  description: >-
    An integrated urban node at Labrador Park combining live, work and
    recreation with nature: green corridors, gradual development volume from
    coast to inland, and a car-lite life built on walking and cycling.
  image: /assets/img/academic/03
  alt: 3D visual of the proposed waterfront promenade and buildings at Labrador Park
- title: Urban Analysis Studio, Redhill
  kicker: Urban analysis · NUS
  description: >-
    Re-evaluated the opportunity to conserve the first public housing site at
    Redhill Estate, the only estate with public housing built in every decade
    since the 1950s.
- title: Wastewater Management System, Hyderabad
  kicker: Final-year thesis · SPA New Delhi
  description: >-
    Assessed Hyderabad's wastewater management system and its impact on health
    and urban agriculture, and proposed techniques and methods to make it
    sustainable.
